name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 在 ubuntu-26.04 的 setup-python 里已经没有预编译包了，从 3.10 起测
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: smoke run (CLI + baseline + sample corpus)
        run: |
          python -m aiaccent --version
          python -m aiaccent baseline
          python -m aiaccent audit examples/sample.jsonl --register chat
          python -m aiaccent audit examples/sample.jsonl --register chat --ci --ci-reps 50
          python -m aiaccent adapt examples/sample.jsonl --max-rel 1
          python -m aiaccent echo examples/pairs.jsonl --show 0
