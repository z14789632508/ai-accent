[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-accent"
version = "0.1.0"
description = "AI 口音的体检表：不看词，看分布"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "moyu" }]
keywords = ["llm", "style", "chatbot", "persona", "evaluation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
aiaccent = "aiaccent.cli:main"

[tool.setuptools]
packages = ["aiaccent"]
